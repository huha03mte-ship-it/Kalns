<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSPAY - Member</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --p-green: #2ecc71; --p-blue: #3498db; --bg-light: #f8fafc;
            --text-main: #2d3436; --shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Kanit', sans-serif; }
        body { background: var(--bg-light); color: var(--text-main); overflow-x: hidden; }

        /* Loading Screen */
        #loader { position:fixed; inset:0; background:#fff; z-index:9999; display:flex; justify-content:center; align-items:center; transition:0.5s; }
        .spinner { width:40px; height:40px; border:4px solid #eee; border-top-color:var(--p-green); border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; position: relative; }
        
        /* Login Section */
        #login-view { padding: 40px 25px; text-align: center; display: block; }
        .login-card { background: #fff; padding: 30px; border-radius: 30px; box-shadow: var(--shadow); margin-top: 20px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { font-size: 0.9rem; color: #636e72; margin-left: 5px; }
        .input-group input { width: 100%; padding: 15px; border-radius: 15px; border: 1.5px solid #eee; outline: none; transition: 0.3s; margin-top: 5px; }
        .input-group input:focus { border-color: var(--p-green); box-shadow: 0 0 10px rgba(46,204,113,0.1); }
        .btn-login { width: 100%; padding: 15px; border: none; border-radius: 15px; background: linear-gradient(to right, var(--p-green), var(--p-blue)); color: #fff; font-size: 1.1rem; cursor: pointer; }

        /* Main Dashboard */
        #main-view { display: none; }
        .header { padding: 30px 20px; background: #fff; border-radius: 0 0 30px 30px; box-shadow: var(--shadow); }
        .balance-card { 
            background: linear-gradient(135deg, #2ecc71, #3498db); padding: 30px; border-radius: 25px; 
            color: #fff; margin-top: 15px; position: relative; overflow: hidden;
        }
        .balance-card::after { content:''; position:absolute; right:-20px; bottom:-20px; width:100px; height:100px; background:rgba(255,255,255,0.1); border-radius:50%; }

        /* Menu Grid */
        .menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .menu-btn { 
            background: #fff; padding: 20px; border-radius: 20px; text-align: center; 
            text-decoration: none; color: inherit; box-shadow: var(--shadow); transition: 0.3s;
        }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn i { font-size: 24px; margin-bottom: 10px; display: block; }

        /* Bottom Nav */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
            background: #fff; display: flex; justify-content: space-around; padding: 15px; 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05); border-radius: 25px 25px 0 0; z-index: 100;
        }
        .nav-item { text-align: center; color: #b2bec3; cursor: pointer; transition: 0.3s; flex: 1; }
        .nav-item.active { color: var(--p-green); }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 0.7rem; display: block; }

        /* History */
        .history-section { padding: 0 20px; }
        .tx-item { background: #fff; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .st-pending { color: #f1c40f; } .st-success { color: #2ecc71; } .st-cancel { color: #e74c3c; }

    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<div class="app-container">
    <div id="login-view">
        <i class="fas fa-wallet" style="font-size: 50px; color: var(--p-green); margin-bottom: 15px;"></i>
        <h2>RSPAY MEMBER</h2>
        <div class="login-card">
            <div class="input-group">
                <label>รหัสสมาชิก 6 หลัก</label>
                <input type="text" id="log-uid" maxlength="6" placeholder="000000">
            </div>
            <div class="input-group">
                <label>รหัสผ่าน</label>
                <input type="password" id="log-pw" placeholder="******">
            </div>
            <button class="btn-login" onclick="login()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <div id="main-view">
        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 id="user-display">ยินดีต้อนรับ</h3>
                <i class="fas fa-bell" style="color:#ccc;"></i>
            </div>
            <div class="balance-card">
                <p style="font-weight:300; opacity:0.9;">ยอดเงินปัจจุบัน</p>
                <h1 id="balance-display" style="font-size: 2.5rem; margin: 5px 0;">0.00</h1>
                <p style="font-size:0.8rem;"><i class="fas fa-sync"></i> อัปเดตอัตโนมัติ</p>
            </div>
        </div>

        <div class="menu-row">
            <a href="https://riszy.shop/?page=payment" class="menu-btn">
                <i class="fas fa-plus-circle" style="color:var(--p-blue);"></i>
                <span>ฝากเงิน</span>
            </a>
            <div class="menu-btn" onclick="openWithdraw()">
                <i class="fas fa-arrow-up-from-bracket" style="color:var(--p-green);"></i>
                <span>ถอนเงิน</span>
            </div>
        </div>

        <div class="history-section" id="section-history">
            <h4 style="margin-bottom: 15px;">ประวัติรายการ 10 ล่าสุด</h4>
            <div id="tx-list"></div>
        </div>
    </div>

    <div class="bottom-nav" id="bot-nav" style="display:none;">
        <div class="nav-item active" onclick="showTab('home')"><i class="fas fa-home"></i><span>หน้าแรก</span></div>
        <div class="nav-item" onclick="openBankProfile()"><i class="fas fa-university"></i><span>ธนาคาร</span></div>
        <div class="nav-item" onclick="location.reload()"><i class="fas fa-sign-out-alt"></i><span>ออก</span></div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyCrpBKrWplX3qQT_h-QMftmaTSV71sikf4",
        authDomain: "fnag-b078c.firebaseapp.com",
        projectId: "fnag-b078c",
        storageBucket: "fnag-b078c.firebasestorage.app",
        messagingSenderId: "168663975101",
        appId: "1:168663975101:web:84b93e4a74494349df23d4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = null;

    window.onload = () => { setTimeout(() => document.getElementById('loader').style.display='none', 800); };

    async function login() {
        const uid = document.getElementById('log-uid').value;
        const pw = document.getElementById('log-pw').value;
        const userDoc = await db.collection('users').doc(uid).get();
        if(userDoc.exists && userDoc.data().password === pw) {
            currentUser = { id: uid, ...userDoc.data() };
            startApp();
        } else {
            Swal.fire('ผิดพลาด', 'ไอดีหรือรหัสผ่านไม่ถูกต้อง', 'error');
        }
    }

    function startApp() {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('bot-nav').style.display = 'flex';
        document.getElementById('user-display').innerText = 'สวัสดี, ' + currentUser.name;

        // Real-time Balance
        db.collection('users').doc(currentUser.id).onSnapshot(doc => {
            document.getElementById('balance-display').innerText = doc.data().balance.toLocaleString(undefined, {minimumFractionDigits: 2}) + ' ฿';
        });

        // Real-time History
        db.collection('transactions').where('uid', '==', currentUser.id).orderBy('timestamp','desc').limit(10).onSnapshot(snap => {
            let html = '';
            snap.forEach(doc => {
                const tx = doc.data();
                const stClass = 'st-' + tx.status;
                html += `<div class="tx-item">
                    <div><b>ถอนเงิน</b><br><small style="color:#ccc">${tx.dateStr}</small></div>
                    <div style="text-align:right"><b class="${stClass}">${tx.amount} ฿</b><br><small>${tx.status}</small></div>
                </div>`;
            });
            document.getElementById('tx-list').innerHTML = html || '<p style="text-align:center; color:#ccc;">ไม่มีรายการ</p>';
        });
    }

    async function openWithdraw() {
        const settings = await db.collection('settings').doc('system').get();
        if(settings.data().withdraw_status === 'closed') return Swal.fire('แจ้งเตือน', 'ระบบถอนเงินปิดปรับปรุง', 'warning');

        const u = (await db.collection('users').doc(currentUser.id).get()).data();
        if(!u.bankAcc) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาตั้งค่าบัญชีธนาคารก่อนถอน', 'info');

        const { value: amt } = await Swal.fire({
            title: 'ระบุยอดเงินที่ต้องการถอน',
            input: 'number',
            inputAttributes: { min: 20 },
            showCancelButton: true,
            confirmButtonText: 'ถอนเงิน'
        });

        if(amt) {
            const amount = parseFloat(amt);
            if(amount < 20) return Swal.fire('ผิดพลาด', 'ถอนขั้นต่ำ 20 บาท', 'error');
            if(amount > u.balance) return Swal.fire('ผิดพลาด', 'ยอดเงินไม่เพียงพอ', 'error');

            const batch = db.batch();
            const txRef = db.collection('transactions').doc();
            batch.update(db.collection('users').doc(currentUser.id), { balance: u.balance - amount });
            batch.set(txRef, {
                uid: currentUser.id, name: u.name, amount: amount,
                bank: u.bank, bankAcc: u.bankAcc, status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                dateStr: new Date().toLocaleString('th-TH')
            });
            await batch.commit();
            Swal.fire('สำเร็จ', 'ส่งคำขอถอนเงินเรียบร้อยแล้ว', 'success');
        }
    }

    async function openBankProfile() {
        const u = (await db.collection('users').doc(currentUser.id).get()).data();
        const { value: formValues } = await Swal.fire({
            title: 'ตั้งค่าบัญชีรับเงิน',
            html: `
                <select id="sw-bank" class="swal2-input">
                    <option value="TrueMoney" ${u.bank=='TrueMoney'?'selected':''}>TrueMoney Wallet</option>
                    <option value="กสิกรไทย" ${u.bank=='กสิกรไทย'?'selected':''}>ธ.กสิกรไทย</option>
                    <option value="ไทยพาณิชย์" ${u.bank=='ไทยพาณิชย์'?'selected':''}>ธ.ไทยพาณิชย์</option>
                    <option value="กรุงไทย" ${u.bank=='กรุงไทย'?'selected':''}>ธ.กรุงไทย</option>
                    <option value="กรุงเทพ" ${u.bank=='กรุงเทพ'?'selected':''}>ธ.กรุงเทพ</option>
                </select>
                <input id="sw-acc" class="swal2-input" placeholder="เลขบัญชี / เบอร์วอลเล็ท" value="${u.bankAcc || ''}">
            `,
            preConfirm: () => ({ bank: document.getElementById('sw-bank').value, bankAcc: document.getElementById('sw-acc').value })
        });
        if(formValues) {
            await db.collection('users').doc(currentUser.id).update(formValues);
            Swal.fire('สำเร็จ', 'บันทึกข้อมูลแล้ว', 'success');
        }
    }
</script>
</body>
</html>
